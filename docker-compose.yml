services:

  polaris:
    image: apache/polaris:latest
    platform: linux/amd64
    ports:
      - "8181:8181"
      - "8182:8182"
    networks:
      - local-iceberg-lakehouse
    volumes:
      - polaris-data:/data
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_STS: http://minio:9000
      # OAuth2 の初期クレデンシャル（bootstrap と一致させる）
      POLARIS_BOOTSTRAP_CREDENTIALS: default-realm,root,secret
      polaris.features.DROP_WITH_PURGE_ENABLED: true # SQL クライアントからの drop を許可
      polaris.realm-context.realms: default-realm
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ★ 初回一回だけ実行する Admin Tool（常駐不要）
  polaris-admin-bootstrap:
    image: apache/polaris-admin-tool:latest
    networks:
      - local-iceberg-lakehouse
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    depends_on:
      - postgres
    command: >
      bootstrap
      -r default-realm
      -c default-realm,root,secret
    # 実行方法:
    #   docker compose run --rm polaris-admin-bootstrap
    # 以後は不要。再実行すると「既に bootstrap 済み」とエラーになる想定。

  trino:
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
    environment:
      - TRINO_JVM_OPTS=-Xmx4G
    networks:
      - local-iceberg-lakehouse
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  minio:
    image: minio/minio:latest
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    networks:
      local-iceberg-lakehouse:
        aliases:
          - warehouse.minio
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]

  # バケット作成＆公開設定のワンショット初期化用
  minio-client:
    image: minio/mc:latest
    depends_on:
      - minio
    networks:
      - local-iceberg-lakehouse
    volumes:
      - /tmp:/tmp
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
    entrypoint: >
      /bin/sh -c "
      until (mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      mc mb minio/warehouse || true;
      mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
    ports:
      - "5432:5432"
    networks:
      - local-iceberg-lakehouse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polaris-data:
  minio-data:
  postgres-data:

networks:
  local-iceberg-lakehouse:
    name: local-iceberg-lakehouse
