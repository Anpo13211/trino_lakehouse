version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: polaris-postgres
    network_mode: host
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Bootstrap polaris - PostgreSQLにメタデータを保存させるためにスキーマを作成
  polaris-admin-bootstrap:
    image: apache/polaris-admin-tool:latest
    container_name: polaris-admin-bootstrap
    network_mode: host
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bootstrap
      -r default-realm
      -c default-realm,root,secret

  polaris-catalog:
    image: apache/polaris:latest
    container_name: polaris-catalog
    network_mode: host
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
      AWS_ENDPOINT_URL_S3: http://192.168.8.150:9000
      AWS_ENDPOINT_URL_STS: http://192.168.8.150:9000
      POLARIS_BOOTSTRAP_CREDENTIALS: default-realm,root,secret
      polaris.features.DROP_WITH_PURGE_ENABLED: "true"
      polaris.realm-context.realms: default-realm
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
