version: '3.8'

services:
  trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator
    hostname: trino-coordinator
    network_mode: host
    environment:
      - TRINO_ENVIRONMENT=production
    volumes:
      - ./config:/etc/trino
      - trino-coordinator-data:/var/trino/data
    deploy:
      resources:
        limits:
          memory: 50G
        reservations:
          memory: 50G
    restart: unless-stopped

volumes:
  trino-coordinator-data:
