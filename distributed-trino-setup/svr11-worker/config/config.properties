coordinator=false
http-server.http.port=8080
query.max-memory=40GB
query.max-memory-per-node=40GB
query.max-total-memory-per-node=45GB
discovery.uri=http://192.168.8.80:8080

# Distributed execution settings
query.remote-task.max-error-duration=5m
exchange.max-buffer-size=32MB
sink.max-buffer-size=32MB
distributed-joins-enabled=true
distributed-sort=true

# Network tuning for distributed setup
exchange.client-threads=25
exchange.concurrent-request-multiplier=3
exchange.max-response-size=32MB
